name: Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.sh check needs the release tags
      - id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Check VERSION, recipes and tag agree
        run: |
          git config user.name ci && git config user.email ci@invalid
          TAG=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; fi
          bash packaging/version.sh check $TAG
      - name: Source tarball (same layout as GitHub's tag archive)
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix=RamkolFX-${{ steps.v.outputs.version }}/ \
            -o dist/RamkolFX-${{ steps.v.outputs.version }}.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with: { name: source, path: dist/ }

  package:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The daemon needs PipeWire >= ~1.4 (spa_json_str_object_find), so
          # build on the oldest distro releases that ship it.
          - { name: deb,  image: 'debian:13',        script: build-deb.sh }
          - { name: rpm,  image: 'fedora:latest',    script: build-rpm.sh }
          # Alpine: 3.23 is the first with onnxruntime (Auto-detect).
          - { name: apk,  image: 'alpine:3.23',      script: build-apk.sh }
          - { name: arch, image: 'archlinux:latest', script: build-arch.sh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: source, path: dist }
      - name: Build ${{ matrix.name }} in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} \
            sh packaging/ci/${{ matrix.script }} ${{ needs.source.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/*.rsa.pub

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - run: nix build .#default --print-build-logs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source, package, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: 'pkg-*', merge-multiple: true }
      - name: Collect files
        run: |
          cp packaging/gentoo/media-sound/ramkolfx/ramkolfx-*.ebuild artifacts/
          cp flake.nix artifacts/
          cd artifacts && sha256sum * > SHA256SUMS && ls -l
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # alpha / beta / rc versions (anything with a "-") are pre-releases
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* $pre \
            --title "RamkolFX $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber

  # Stable releases only (no "-" in the tag), so AUR and COPR users are never
  # offered an alpha/beta/rc. Each job skips itself, with a notice, until its
  # secret is added; see packaging/PUBLISHING.md.
  aur:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Push PKGBUILD to the AUR
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR update"
            exit 0
          fi
          docker run --rm -e AUR_SSH_PRIVATE_KEY -v "$PWD":/src -w /src archlinux:latest \
            sh packaging/ci/push-aur.sh

  copr:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      COPR_PROJECT: ${{ vars.COPR_PROJECT || 'ramkolfx' }}
    steps:
      - name: Build the tag in COPR
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::notice::COPR_CONFIG is not set; skipping the COPR build"
            exit 0
          fi
          pipx install copr-cli
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          # COPR clones the tag and runs .copr/Makefile to make the SRPM, then
          # builds it for every chroot enabled in the project. Waits so a
          # failed build shows up here.
          copr-cli buildscm "$COPR_PROJECT" \
            --clone-url "https://github.com/$GITHUB_REPOSITORY" \
            --commit "$GITHUB_REF_NAME" \
            --method make_srpm \
            --spec packaging/rpm/ramkolfx.spec
